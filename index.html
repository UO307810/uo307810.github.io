<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi galería de fotos</title>
  <style>
    /* Ajustes generales para que se lea y se vea limpio */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f5f5f7;
      color: #1f2937;
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    header {
      max-width: 960px;
      margin: 0 auto 2.5rem auto;
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.4rem;
    }

    header p {
      color: #4b5563;
    }

    /* Cuadrícula adaptable de fotos */
    .galeria {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    figure {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      padding-bottom: 0.9rem;
    }

    figure img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover; /* Recorta con suavidad sin aplastar la foto */
    }

    figcaption {
      padding: 0.8rem 1rem 0 1rem;
      font-size: 0.95rem;
      color: #374151;
    }

    footer {
      max-width: 960px;
      margin: 3rem auto 0 auto;
      text-align: center;
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mis fotos</h1>
    <p>Una pequeña selección de momentos y lugares.</p>
  </header>

  <main class="galeria">
    <figure>
      <img src="Fotos/foto1.jpg" alt="Descripción de la primera foto">
      <figcaption>Primera foto — aquí puedes poner un comentario breve.</figcaption>
    </figure>

    <figure>
      <img src="Fotos/foto2.jpg" alt="Descripción de la segunda foto">
      <figcaption>Segunda foto — otro pie de foto corto.</figcaption>
    </figure>

    <figure>
      <img src="Fotos/foto3.jpg" alt="Descripción de la tercera foto">
      <figcaption>Tercera foto — añade o quita bloques &lt;figure&gt; a tu gusto.</figcaption>
    </figure>
  </main>

  <footer>
    <p>Hecho con HTML y CSS en GitHub Pages.</p>
  </footer>

</body>
</html>
