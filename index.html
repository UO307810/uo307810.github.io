    <script src = "fotos.js"></script>
    
    <style>
      @font-face {
      font-family: "ADLaM_Display";
      src: url("ADLaMDisplay_Regular.ttf") format("truetype");
      font-display: swap;
      }

      body{
        background: #fff0ae;
        color: #1f001f;
        font-family: "ADLaM_Display", "Copperplate Gothic Bold", "Times New Roman";
        margin: 60px;
        padding: 3rem 1.5rem;
        text-align: center;
        padding-top: 50px;
      }

      h1{
        /* font-family: 'Times New Roman'; */
        font-size: 13rem;
        font-weight: 700;
        font-style: italic;
        letter-spacing: 0.2em;
        text-shadow: 2px 2px 6px #000000;
        word-spacing: 0.3em;
        line-height: 1.5;
        text-indent: 0rem;
        text-align: center;
      }

      img {
        width: 100%;
        max-width: 500px;
        border-radius: 10px;
      }

      .image-grid{
        --gap: 25px;
        --num-cols: 4;
        --row-height: 500px;
        box-sizing: border-box;
        padding: var(--gap);
        display: grid;
        grid-template-columns: repeat(var(--num-cols), 1fr);
        grid-auto-rows: var(--row-height);
        gap: var(--gap);
      }

      .image-grid img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      @media screen and (max-width: 1500px){
        .image-grid{
          --num-cols: 2;
          --row-height: 250px;
        }
      }

      div img{
        transition: transform 0.53s ease-out;
      }

      div img:hover{
        transform: scale(1.1);
      }
      
      .click-zoom input[type=checkbox] {
        display: none
      }

      .click-zoom img {
        margin: 100px;
        transition: transform 0.3s ease;
        cursor: zoom-in
      }

      .click-zoom input[type=checkbox]:checked~img {
        transform: scale(5);
        cursor: zoom-out
      }
      
    </style>
  </head>
  <body>
    <h1> FOTOGRAFÍAS </h1>
    <div class = "image-grid">
      <script>
        const galeria = document.querySelector(".image-grid");
        conts_fotos.forEach(function (nombre) {

          const caja = document.createElement("div");
          const label = document.createElement("label");
          const input = document.createElement("input");
          const img = document.createElement("img");

          caja.className = "click-zoom";
          input.type = "checkbox";
          img.src = "Fotos/" + nombre;

          label.appendChild(input);
          label.appendChild(img);
          caja.appendChild(label);

          galeria.appendChild(caja);
        });
      </script>
    </div>
    <h1> VIDEOS </h1>
  </body>
</html>
