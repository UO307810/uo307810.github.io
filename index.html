    <script src = "fotos.js"></script>
    <script src = "videos.js"></script>
    
    <style>
      @font-face {
      font-family: "ADLaM_Display";
      src: url("ADLaMDisplay_Regular.ttf") format("truetype");
      font-display: swap;
      }

      body{
        background: #fff0ae;
        color: #1f001f;
        font-family: "ADLaM_Display", "Copperplate Gothic Bold", "Times New Roman", serif;
        margin: 60px;
        padding: 1vw 10vw 3vw;
        text-align: center;
        padding-top: 20px;
      }

      h1{
        /* font-family: 'Times New Roman'; */
        font-size:  clamp(1rem, 5vw, 130rem);
        font-weight: 700;
        font-style: italic;
        letter-spacing: 0.2em;
        text-shadow: 2px 2px 6px #000000;
        word-spacing: 0.3em;
        line-height: 0.5;
        text-indent: 0rem;
        text-align: center;
      }

      img {
        width: 100%;
        border-radius: 14px;
      }

      video {
        width: 100%;
        border-radius: 14px;
      }

      .image-grid{
        grid-template-columns: repeat(auto-fill, minmax(600px, 1fr));
        --gap: 70px;
        /*--num-cols: 4;*/
        --row-height: 500px;
        box-sizing: border-box;
        padding: var(--gap);
        display: grid;
        /*grid-auto-rows: var(--row-height);*/
        gap: var(--gap);
      }

      .image-grid img {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        object-fit: cover;
      }

      .image-grid video {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        object-fit: cover;
      }

      /*
      @media screen and (max-width: 3000px){
        .image-grid{
          --num-cols: 2;
          --row-height: 250px;
        }
      }*/

      div img{
        transition: transform 0.53s ease-out;
      }

      div video{
        transition: transform 0.53s ease-out;
      }

      div img:hover{
        transform: scale(1.2);
      }

      div video:hover{
        transform: scale(1.5);
      }
      
      .click-zoom input[type=checkbox] {
        display: none
      }

      .click-zoom img {
        transition: transform 0.3s ease;
        cursor: zoom-in
      }

      .click-zoom input[type=checkbox]:checked~img {
        transform: scale(2.85);
        cursor: zoom-out
      }
      
    </style>
  </head>
  <body>
    <h1> FOTOGRAFÍAS </h1>
    <div class = "image-grid">
      <script>
        const galeria = document.querySelector(".image-grid");
        conts_fotos.forEach(function (nombre) {

          const caja = document.createElement("div");
          const label = document.createElement("label");
          const input = document.createElement("input");
          const img = document.createElement("img");

          caja.className = "click-zoom";
          input.type = "checkbox";
          img.src = "Fotos/" + nombre;

          label.appendChild(input);
          label.appendChild(img);
          caja.appendChild(label);

          galeria.appendChild(caja);
        });
      </script>
    </div>
    <h1> VIDEOS </h1>
    <div class = "image-grid" id = "galVids">
      <script>
        const galeriaVids = document.querySelector("#galVids");
        conts_videos.forEach(function (nombre) {

          /*
          const caja = document.createElement("div");
          const label = document.createElement("label");
          const input = document.createElement("input");
          */
          const video = document.createElement("video");

          video.src = "Videos/" + nombre;
          video.controls = true;
          video.preload = "metadata";

          /*
          caja.className = "click-zoom";
          input.type = "checkbox";
          img.src = "Videos/" + nombre;

          label.appendChild(input);
          label.appendChild(img);
          caja.appendChild(label);
          */

          galeriaVids.appendChild(video);
        });
      </script>
    </div>
  </body>
</html>
