<html lang="es">
  <head>
    <title> Fotografías. </title>
    <meta charset = "utf8">
    <meta name = "theme-color" content = "#FFA51F">
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">

    <script src = "fotos.js"></script>
    <script src = "videos.js"></script>
    
    <style>
      @font-face {
      font-family: "ADLaM_Display";
      src: url("ADLaMDisplay_Regular.ttf") format("truetype");
      font-display: swap;
      }

      body{
        background: #fff0ae;
        color: #1f001f;
        font-family: "ADLaM_Display", "Copperplate Gothic Bold", "Times New Roman", serif;
        margin: 2vw;
        padding: 1vw 5vw 3vw;
        text-align: center;
        padding-top: 1vw;
      }

      h1{
        /* font-family: 'Times New Roman'; */
        font-size:  clamp(1rem, 9vw, 130rem);
        font-weight: 700;
        font-style: italic;
        letter-spacing: 0.6vw;
        text-shadow: 0.1vw 0.1vw 0.3vw #000000;
        word-spacing: 1.2vw;
        line-height: 0.4vw;
        text-indent: 0vw;
        text-align: center;
        padding-top: 0.6vw;
      }

      img {
        width: 100%;
        border-radius: 0.7vw;
      }

      video {
        width: 100%;
        border-radius: 0.7vw;
      }

      .image-grid{
        /* grid-template-columns: repeat(auto-fill, minmax(600px, 1fr)); */
        --gap: 2.5vw;
        /*--num-cols: 4;*/
        --row-height: 20vw;
        box-sizing: border-box;
        padding: var(--gap);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        /*grid-auto-rows: var(--row-height);*/
        gap: var(--gap);
      }

      .image-grid > * {
        flex: 0 1 350px;
      }

      @media (max-width: 900px) {
        .image-grid > * {
          flex-basis: calc(50% - var(--gap) / 2);
        }
        .click-zoom input[type=checkbox]:checked~img {
        transform: scale(1.6;
        cursor: zoom-out
        }
        div img:hover{
        transform: scale(1);
        }
        div video:hover{
        transform: scale(1);
        }
        
      }

      #galVids > * {
        flex: 0 1 600px;
      }

      @media (max-width: 900px) {
        #galVids > * {
          flex-basis: calc(32% - var(--gap) / 3);
        }
        .click-zoom input[type=checkbox]:checked~img {
        transform: scale(1.6;
        cursor: zoom-out
        }
        div img:hover{
        transform: scale(1);
        }
        div video:hover{
        transform: scale(1);
        }
      }

      .image-grid img {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        object-fit: cover;
      }

      .image-grid video {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        object-fit: cover;
      }

      /*
      @media screen and (max-width: 3000px){
        .image-grid{
          --num-cols: 2;
          --row-height: 250px;
        }
      }*/

      div img{
        transition: transform 0.53s ease-out;
      }

      div video{
        transition: transform 0.53s ease-out;
      }

      div img:hover{
        transform: scale(1.2);
      }

      div video:hover{
        transform: scale(1.5);
      }
      
      .click-zoom input[type=checkbox] {
        display: none
      }

      .click-zoom img {
        transition: transform 0.3s ease;
        cursor: zoom-in
      }

      .click-zoom input[type=checkbox]:checked~img {
        transform: scale(2.2);
        cursor: zoom-out
      }
      
    </style>
  </head>
  <body>
    <h1> FOTOGRAFÍAS </h1>
    <div class = "image-grid">
      <script>
        const galeria = document.querySelector(".image-grid");
        conts_fotos.forEach(function (nombre) {

          const caja = document.createElement("div");
          const label = document.createElement("label");
          const input = document.createElement("input");
          const img = document.createElement("img");

          caja.className = "click-zoom";
          input.type = "checkbox";
          img.src = "Fotos/" + nombre;

          label.appendChild(input);
          label.appendChild(img);
          caja.appendChild(label);

          galeria.appendChild(caja);
        });
      </script>
    </div>
    <h1> VIDEOS </h1>
    <div class = "image-grid" id = "galVids">
      <script>
        const galeriaVids = document.querySelector("#galVids");
        conts_videos.forEach(function (nombre) {

          /*
          const caja = document.createElement("div");
          const label = document.createElement("label");
          const input = document.createElement("input");
          */
          const video = document.createElement("video");

          video.src = "Videos/" + nombre;
          video.controls = true;
          video.preload = "metadata";

          /*
          caja.className = "click-zoom";
          input.type = "checkbox";
          img.src = "Videos/" + nombre;

          label.appendChild(input);
          label.appendChild(img);
          caja.appendChild(label);
          */

          galeriaVids.appendChild(video);
        });
      </script>
    </div>
  </body>
</html>
